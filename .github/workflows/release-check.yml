name: Release checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Go release gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned analysis tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Record source and toolchain metadata
        run: |
          mkdir -p dist
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "go=$(go version)"
            echo "golangci_lint=$(golangci-lint --version)"
            echo "gitleaks_module=$(go version -m "$(command -v gitleaks)" | awk '$1 == "mod" && $2 == "github.com/zricethezav/gitleaks/v8" { print $3 }')"
            echo "platform=$(go env GOOS)/$(go env GOARCH)"
          } > dist/release-metadata.txt

      - name: Run format, vet, lint, tests, SQLite driver test, secret scan, and build
        env:
          GOTOOLCHAIN: local
        run: make release-check 2>&1 | tee dist/release-check.log

      - name: Save build and checksum
        if: success()
        run: |
          cp bin/gorest-api-starter dist/gorest-api-starter-linux-amd64
          sha256sum dist/gorest-api-starter-linux-amd64 > dist/SHA256SUMS

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-check-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 90
