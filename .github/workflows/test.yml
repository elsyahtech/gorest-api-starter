name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Generate unit coverage reports
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/unit.coverprofile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            coverage/unit.coverprofile
            coverage/unit-coverage.txt
            coverage/unit-coverage.html
          if-no-files-found: warn
          retention-days: 30

  integration-config:
    name: Check PostgreSQL mTLS test configuration
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required PostgreSQL test secrets
        id: check
        shell: bash
        env:
          POSTGRES_HOST: ${{ secrets.GOREST_TEST_POSTGRES_HOST }}
          POSTGRES_DATABASE: ${{ secrets.GOREST_TEST_POSTGRES_DATABASE }}
          POSTGRES_USER: ${{ secrets.GOREST_TEST_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.GOREST_TEST_POSTGRES_PASSWORD }}
          POSTGRES_TLS: ${{ secrets.GOREST_TEST_POSTGRES_TLS }}
          POSTGRES_CA_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CA_PEM }}
          POSTGRES_CLIENT_CERT_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CLIENT_CERT_PEM }}
          POSTGRES_CLIENT_KEY_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CLIENT_KEY_PEM }}
          POSTGRES_CONFIRM_DATABASE: ${{ secrets.GOREST_TEST_POSTGRES_CONFIRM_DATABASE }}
          POSTGRES_ALLOW_NON_TEST_DATABASE: ${{ secrets.GOREST_TEST_POSTGRES_ALLOW_NON_TEST_DATABASE }}
        run: |
          configured=true
          if [[ -z "$POSTGRES_HOST" || -z "$POSTGRES_DATABASE" || -z "$POSTGRES_USER" ||
                -z "$POSTGRES_PASSWORD" || -z "$POSTGRES_CA_PEM" ||
                -z "$POSTGRES_CLIENT_CERT_PEM" || -z "$POSTGRES_CLIENT_KEY_PEM" ]]; then
            configured=false
          elif [[ "$POSTGRES_TLS" != "verify-ca" && "$POSTGRES_TLS" != "verify-full" ]]; then
            configured=false
          elif [[ "$POSTGRES_CONFIRM_DATABASE" != "$POSTGRES_DATABASE" ]]; then
            configured=false
          elif [[ "$POSTGRES_DATABASE" != *_test && "$POSTGRES_DATABASE" != *_testing &&
                  "$POSTGRES_ALLOW_NON_TEST_DATABASE" != "$POSTGRES_DATABASE" ]]; then
            configured=false
          fi

          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [[ "$configured" == "false" ]]; then
            echo "PostgreSQL integration tests skipped: configure all required GOREST_TEST_POSTGRES_* secrets for a dedicated non-production mTLS database."
          fi

  integration:
    name: PostgreSQL mTLS integration tests
    runs-on: ubuntu-24.04
    needs: integration-config
    if: needs.integration-config.outputs.configured == 'true'
    env:
      GODEBUG: netdns=cgo
      GOREST_APP_ENV: testing
      GOREST_DB_DISABLE: "false"
      GOREST_DB_DRIVER: postgres
      GOREST_DB_HOST: ${{ secrets.GOREST_TEST_POSTGRES_HOST }}
      GOREST_DB_PORT: ${{ secrets.GOREST_TEST_POSTGRES_PORT }}
      GOREST_DB_NAME: ${{ secrets.GOREST_TEST_POSTGRES_DATABASE }}
      GOREST_DB_USER: ${{ secrets.GOREST_TEST_POSTGRES_USER }}
      GOREST_DB_PASSWORD: ${{ secrets.GOREST_TEST_POSTGRES_PASSWORD }}
      GOREST_DB_TLS: ${{ secrets.GOREST_TEST_POSTGRES_TLS }}
      GOREST_TEST_POSTGRES_CONFIRM_DATABASE: ${{ secrets.GOREST_TEST_POSTGRES_CONFIRM_DATABASE }}
      GOREST_TEST_POSTGRES_ALLOW_NON_TEST_DATABASE: ${{ secrets.GOREST_TEST_POSTGRES_ALLOW_NON_TEST_DATABASE }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure PostgreSQL mTLS certificates
        shell: bash
        env:
          POSTGRES_CA_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CA_PEM }}
          POSTGRES_CLIENT_CERT_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CLIENT_CERT_PEM }}
          POSTGRES_CLIENT_KEY_PEM: ${{ secrets.GOREST_TEST_POSTGRES_CLIENT_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          ca_file="$RUNNER_TEMP/gorest-postgres-ca.pem"
          cert_file="$RUNNER_TEMP/gorest-postgres-client-cert.pem"
          key_file="$RUNNER_TEMP/gorest-postgres-client-key.pem"
          printf '%s\n' "$POSTGRES_CA_PEM" > "$ca_file"
          printf '%s\n' "$POSTGRES_CLIENT_CERT_PEM" > "$cert_file"
          printf '%s\n' "$POSTGRES_CLIENT_KEY_PEM" > "$key_file"
          openssl x509 -in "$ca_file" -noout
          openssl x509 -in "$cert_file" -noout
          openssl pkey -in "$key_file" -noout
          {
            printf 'GOREST_DB_CA_PATH=%s\n' "$ca_file"
            printf 'GOREST_DB_CERT_PATH=%s\n' "$cert_file"
            printf 'GOREST_DB_KEY_PATH=%s\n' "$key_file"
          } >> "$GITHUB_ENV"

      - name: Run PostgreSQL integration tests and reports
        run: make integration-reports

      - name: Upload integration coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/integration.coverprofile
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-integration-report-${{ github.sha }}
          path: |
            coverage/integration-test.txt
            coverage/integration-test.json
            coverage/integration.coverprofile
            coverage/integration-coverage.txt
            coverage/integration-coverage.html
          if-no-files-found: warn
          retention-days: 30
